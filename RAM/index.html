<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>RAM - Redirect</title>
  <!-- Reindirizzamento automatico dopo 2 secondi (modifica il 2 in 0 se lo vuoi istantaneo) -->
  <meta http-equiv="refresh" content="2; url=https://expanded-lawyers-essentials-arrange.trycloudflare.com/RAM/">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080711;
      color: #e0d9f6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      text-align: center;
      background: rgba(18, 15, 35, 0.85);
      border: 2px solid #b026ff;
      box-shadow: 0 0 25px rgba(176, 38, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 30px;
      max-width: 400px;
      width: 90%;
    }
    .thumb-container {
      width: 130px;
      height: 130px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #00f0ff;
      box-shadow: 0 0 15px #00f0ff;
    }
    .thumb-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 8px;
      text-shadow: 0 0 10px #b026ff;
      letter-spacing: 2px;
    }
    p {
      font-size: 0.9rem;
      color: #a39bb5;
      margin-bottom: 20px;
    }
    .loader {
      width: 100%;
      height: 4px;
      background: #201b38;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .loader-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #b026ff, #00f0ff);
      animation: load 2s linear infinite;
      transform-origin: left;
    }
    @keyframes load {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
    a.btn {
      display: inline-block;
      padding: 10px 18px;
      background: transparent;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }
    a.btn:hover {
      background: #00f0ff;
      color: #080711;
      box-shadow: 0 0 20px #00f0ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="thumb-container">
      <img src="thumb.jpeg" alt="RAM Thumbnail">
    </div>
    <h1>R.A.M.</h1>
    <p>Connessione al server in corso...</p>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
    <a href="https://expanded-lawyers-essentials-arrange.trycloudflare.com/RAM/" class="btn">Accedi subito</a>
  </div>
</body>
</html>
