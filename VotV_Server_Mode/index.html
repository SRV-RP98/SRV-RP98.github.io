<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>VotV Server Mode — connecting</title><style>body{background:#020504;color:#e2ffec;font:17px/1.6 Consolas,monospace;max-width:650px;margin:15vh auto;padding:30px}h1{text-shadow:0 0 10px #62d99b}a{color:#a1ebbe}code{color:#a1ebbe}</style></head><body><h1>VotV Server Mode</h1><p id="message">Connessione alla stazione… / Connecting to the station…</p><a id="link" hidden>Apri il sito / Open website</a><script>
fetch('route.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{const u=new URL(j.baseUrl);if(j.schema!==1||u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error();u.hash=location.hash;document.getElementById('link').href=u.href;document.getElementById('link').hidden=false;location.replace(u.href)}).catch(()=>{document.getElementById('message').textContent='Stazione temporaneamente non disponibile. Il gestore deve aggiornare il tunnel. / Station temporarily unavailable. The maintainer needs to update the tunnel.'});
</script><noscript>JavaScript richiesto per il redirect. / JavaScript is required for this redirect.</noscript></body></html>
